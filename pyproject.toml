[tool.uv]
override-dependencies = [
    "torch==2.11",
    "torchvision==0.26",
    "torchaudio==2.11",
    "numpy>=2.3.4",
    "pickle5; python_version < '3.8'", # Do not install pickle 5 unless python version < 3.8, which isn't actually possible.
    "spconv-cu126>=2.3.6",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

sam-2 = { path = "./Third_Party/sam2", editable = false }
groundingdino = { path = "./Third_Party/GroundingDINO", editable = true }
grasp_gen = { path = "./Third_Party/GraspGen", editable = true }
pointnet2_ops = { path = "./Third_Party/GraspGen/pointnet2_ops", editable = true }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true



[tool.uv.extra-build-dependencies]
groundingdino = ["torch==2.11", "numpy", "ninja"]
pointnet2_ops = ["torch==2.11"]
torch-scatter = ["torch==2.11"]
torch-cluster = ["torch==2.11"]

[project.optional-dependencies]
localextras = ["pyzed"] # this doesn't work at all.
